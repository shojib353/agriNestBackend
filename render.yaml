services:
  - type: web
    name: agrinest-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT agriNest.asgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agrinest-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: WEB_CONCURRENCY
        value: 4